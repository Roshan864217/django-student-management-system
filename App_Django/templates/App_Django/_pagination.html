{% if page.paginator.num_pages > 1 %}
<div class="pagination">
    {% if page.has_previous %}<a class="btn btn-sm" href="?page={{ page.previous_page_number }}{% if q %}&q={{ q|urlencode }}{% endif %}">&laquo; Prev</a>{% endif %}
    <span>Page {{ page.number }} of {{ page.paginator.num_pages }}</span>
    {% if page.has_next %}<a class="btn btn-sm" href="?page={{ page.next_page_number }}{% if q %}&q={{ q|urlencode }}{% endif %}">Next &raquo;</a>{% endif %}
</div>
{% endif %}
